<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hai!</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. Variabel warna
       ========================================================= */
    :root {
      --bg:    #17131d;
      --ivory: #f4ede4;
      --gold:  #d9c3a0;
      --mute:  #9a93a3;
      --ink:   #2a2230;
    }

    /* =========================================================
       2. Dasar
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      background: radial-gradient(90% 60% at 50% 0%, #241c2e 0, var(--bg) 70%);
      color: var(--ivory);
      font-family: Jost, system-ui, sans-serif;
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }

    h1,
    h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      line-height: 1.1;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px 90px;
    }

    section {
      padding: 56px 0;
      text-align: center;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
    }

    /* =========================================================
       3. Bagian kue (hero)
       ========================================================= */
    #hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px 0;
    }


    #hero h1 {
      font-size: clamp(2.4rem, 10vw, 4.2rem);
      font-style: italic;
      letter-spacing: 0.01em;
    }

    #hero p {
      margin-top: 14px;
      color: var(--mute);
      font-size: 1.02rem;
    }

    #cake {
      display: block;
      width: min(400px, 90vw);
      margin: 40px auto 0;
    }

    .hint {
      display: inline-block;
      margin-top: 32px;
      color: var(--gold);
      font-size: 1.1rem;
      letter-spacing: 0.04em;
    }

    /* Api lilin */
    .flame {
      cursor: pointer;
      stroke: transparent;
      stroke-width: 24px;
      stroke-linejoin: round;
      transform-origin: center bottom;
      transform-box: fill-box;
      animation: flicker 1.1s ease-in-out infinite alternate;
    }

    .flame:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .flame.off {
      opacity: 0;
      transform: scale(0.2);
      transition: 0.35s;
      animation: none;
    }

    /* Asap muncul tepat setelah api padam */
    .smoke {
      opacity: 0;
    }

    .off + .smoke {
      animation: smoke 1.6s ease-out;
    }

    @keyframes flicker {
      from { transform: scale(1, 1) rotate(-2deg); }
      to   { transform: scale(0.92, 1.1) rotate(2deg); }
    }

    @keyframes smoke {
      0%   { opacity: 0.6; transform: translateY(0); }
      100% { opacity: 0;   transform: translateY(-26px); }
    }
    /* =========================================================
       4. Bagian setelah lilin padam
       ========================================================= */
    #after {
      display: none;
    }

    #after.show {
      display: block;
    }

    #after h2 {
      margin-bottom: 8px;
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      font-style: italic;
    }


    /* ---- Foto ---- */
    .photo {
      width: min(300px, 100%);
      margin: 32px auto 0;
      padding: 10px;
      border: 1px solid rgba(217, 195, 160, 0.45);
      border-radius: 4px;
    }

    .photo[hidden] {
      display: none;
    }

    .photo img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      border-radius: 2px;
      object-fit: cover;
    }

    /* ---- Surat ---- */
    #letter {
      margin-top: 28px;
    }

    .env {
      width: min(380px, 100%);
      margin: 0 auto;
      padding: 28px 24px;
      border: 1px solid rgba(217, 195, 160, 0.45);
      border-radius: 4px;
      background: transparent;
      color: var(--ivory);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .env:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .env b {
      display: block;
      color: var(--gold);
      font-family: "Cormorant Garamond", serif;
      font-size: 1.5rem;
      font-style: italic;
      font-weight: 500;
      text-align: center;
    }

    .env .tap {
      display: block;
      margin-top: 6px;
      color: var(--mute);
      font-size: 0.9rem;
      text-align: center;
    }

    .env .msg {
      display: none;
      margin-top: 14px;
      font-weight: 400;
      white-space: pre-line;
    }

    /* Surat terbuka */
    .env.open {
      background: var(--ivory);
      color: var(--ink);
    }

    .env.open b {
      color: #7a6446;
    }

    .env.open .tap {
      display: none;
    }

    .env.open .msg {
      display: block;
    }

    /* =========================================================
       5. Tombol musik
       ========================================================= */
    .sound {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: 14px;
      z-index: 10;
      display: none;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(217, 195, 160, 0.45);
      border-radius: 50%;
      background: rgba(23, 19, 29, 0.6);
      color: var(--gold);
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .sound.show {
      display: grid;
      place-items: center;
    }

    .sound:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .sound .slash {
      display: none;
    }

    .sound.muted .slash {
      display: block;
    }

    .sound.muted .waves {
      display: none;
    }

    /* =========================================================
       6. Aksesibilitas
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      .flame      { animation: none; }
    }
  </style>
</head>

<body>
  <!-- Lapisan konfeti -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Tombol musik (muncul setelah lilin padam) -->
  <button class="sound" id="sound" type="button" aria-label="Matikan musik">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" />
      <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" />
      <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5" />
    </svg>
  </button>

  <main>

    <!-- Bagian 1: kue dan lilin -->
    <section id="hero">
      <h1 id="title"></h1>

      <svg id="cake" viewBox="0 0 340 300" role="img" aria-label="Kue ulang tahun dengan tiga lilin">
        <!-- Bayangan -->
        <ellipse cx="170" cy="272" rx="150" ry="16" fill="#00000055" />

        <!-- Badan kue -->
        <rect x="40" y="170" width="260" height="100" rx="20" fill="#cfa9a8" />
        <rect x="62" y="120" width="216" height="60" rx="18" fill="#efe3d3" />

        <!-- Krim -->
        <path d="M40 190q22 22 44 0t44 0 44 0 44 0 44 0v-10H40z" fill="#fbf6ef" />
        <path d="M62 140q18 18 36 0t36 0 36 0 36 0 36 0v-10H62z" fill="#fbf6ef" />

        <!-- Hiasan -->
        <circle cx="90" cy="228" r="7" fill="#d9c3a0" />
        <circle cx="170" cy="236" r="7" fill="#f4ede4" />
        <circle cx="250" cy="228" r="7" fill="#d9c3a0" />

        <!-- Lilin dibuat oleh script.js -->
        <g id="candles"></g>
      </svg>

      <span class="hint" id="hint">Ketuk api lilin untuk kejutan</span>
    </section>

    <!-- Bagian 2: muncul setelah semua lilin padam -->
    <section id="after">
      <h2>Selamat Ulang Tahun 🎂</h2>

      <figure class="photo" id="photo" hidden>
        <img id="photoImg" alt="">
      </figure>

      <div id="letter">
        <button class="env" id="env" type="button" aria-expanded="false">
          <b>Ada surat untukmu</b>
          <span class="tap">Ketuk untuk membuka</span>
          <span class="msg" id="msg"></span>
        </button>
      </div>
    </section>

  </main>

  <script>
    /* =========================================================
       1. PENGATURAN: ubah teks di sini
       Gunakan {name} dan {age} untuk memasukkan nama dan umur.
       ========================================================= */
    const CONFIG = {
      name: "Rani",
      age: 19,
      greeting: "Hai Ranii!",

      // Foto sudah tertanam di file ini (PHOTO_DATA).
      // Hapus baris ini kalau ingin menyembunyikan foto.
      photo: PHOTO_DATA,

      // Musik: kosongkan untuk musik bawaan (kotak musik "Happy Birthday"
      // yang dibuat langsung di browser). Atau isi nama file lagu yang
      // diunggah ke folder yang sama, misalnya "lagu.mp3".
      music: "",

      letter:
        "Hai Rani, selamat ulang tahun!\n\n" +
        "Udah 19 tahun niih? Bertambahnya usia berarti tanggung jawab kamu juga semakin besar, " +
        "selalu berprogres menjadi pribadi yang lebih baik yaa!\n\n" +
        "Yang engga kalah penting, tolong di jaga kesehatannya 😆 " +
        "InsyaAllah doa terbaikku untuk kamuu.\n\n" +
        "Salam hangat,\n" +
        "Raihan Demassani",
    };

    /* =========================================================
       2. Fungsi bantu
       ========================================================= */
    const $ = (selector) => document.querySelector(selector);

    const fill = (text) =>
      text.replace(/{name}/g, CONFIG.name).replace(/{age}/g, CONFIG.age);

    const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* =========================================================
       3. Isi teks awal
       ========================================================= */
    document.title = `Untuk ${CONFIG.name} 🎂`;
    $("#title").textContent = CONFIG.greeting;
    $("#msg").textContent   = fill(CONFIG.letter);

    // Foto: tampil hanya kalau file-nya berhasil dimuat
    const photoImg = $("#photoImg");
    photoImg.alt = `Foto ${CONFIG.name}`;
    photoImg.addEventListener("load", () => { $("#photo").hidden = false; });
    photoImg.src = CONFIG.photo;

    /* =========================================================
       4. Lilin
       ========================================================= */
    const SVG_NS = "http://www.w3.org/2000/svg";
    const candleXPositions = [90, 170, 250];
    let litCandles = candleXPositions.length;

    function createCandle(x, index) {
      const isMiddle  = index === 1;
      const bodyY     = isMiddle ? 72 : 80;
      const bodyH     = isMiddle ? 58 : 50;
      const flameY    = isMiddle ? 40 : 48;
      const smokeY    = isMiddle ? 44 : 52;
      const bodyColor = isMiddle ? "#f4ede4" : "#d9c3a0";

      const group = document.createElementNS(SVG_NS, "g");
      group.innerHTML = `
        <rect x="${x - 6}" y="${bodyY}" width="12" height="${bodyH}" rx="4" fill="${bodyColor}" />
        <path class="flame" tabindex="0" role="button" aria-label="Tiup lilin ${index + 1}"
              d="M${x} ${flameY}c10 14 12 22 0 30c-12-8-10-16 0-30z" fill="#f2b866" />
        <circle class="smoke" cx="${x}" cy="${smokeY}" r="7" fill="#ffffff44" />
      `;
      $("#candles").appendChild(group);
    }

    function blowOut(flame) {
      if (flame.classList.contains("off")) return;

      Music.unlock(); // izin audio harus diminta saat layar diketuk
      flame.classList.add("off");
      flame.removeAttribute("tabindex");
      litCandles--;

      $("#hint").textContent = litCandles
        ? `Tinggal ${litCandles} lilin lagi`
        : "Make a wish…";

      if (litCandles === 0) setTimeout(celebrate, 500);
    }

    candleXPositions.forEach(createCandle);

    document.querySelectorAll(".flame").forEach((flame) => {
      flame.addEventListener("click", () => blowOut(flame));
      flame.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          blowOut(flame);
        }
      });
    });


    /* =========================================================
       5. Surat
       ========================================================= */
    $("#env").addEventListener("click", (event) => {
      const envelope = event.currentTarget;
      const isOpen = envelope.classList.toggle("open");
      envelope.setAttribute("aria-expanded", isOpen);
    });

    /* =========================================================
       6. Konfeti
       ========================================================= */
    const canvas = $("#fx");
    const ctx = canvas.getContext("2d");
    const CONFETTI_COLORS = ["#cfa9a8", "#efe3d3", "#f4ede4", "#d9c3a0", "#ffffff"];
    let particles = [];
    let animationId = 0;

    function resizeCanvas() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    resizeCanvas();
    addEventListener("resize", resizeCanvas);

    function burst(x, y, count) {
      if (prefersReducedMotion) return;

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 6;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          size: 4 + Math.random() * 5,
          color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
          rotation: Math.random() * 6,
          life: 110,
        });
      }

      if (!animationId) animationId = requestAnimationFrame(drawConfetti);
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter((p) => p.life > 0);

      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.18;   // gravitasi
        p.vx *= 0.99;   // hambatan udara
        p.rotation += 0.1;
        p.life--;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = Math.min(1, p.life / 30);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
        ctx.restore();
      });

      animationId = particles.length ? requestAnimationFrame(drawConfetti) : 0;
    }

    /* =========================================================
       7. Musik
       ========================================================= */
    const Music = (() => {
      const button = $("#sound");

      // Frekuensi nada (Hz)
      const NOTE = {
        F2: 87.31, Bb2: 116.54, C3: 130.81, C4: 261.63, D4: 293.66, E4: 329.63,
        F4: 349.23, G4: 392.0, A4: 440.0, Bb4: 466.16, C5: 523.25,
      };

      // "Happy Birthday" (lagu domain publik): [nada, panjang dalam ketukan]
      const BEAT = 0.6;
      const MELODY = [
        ["C4", 0.75], ["C4", 0.25], ["D4", 1], ["C4", 1], ["F4", 1], ["E4", 2],
        ["C4", 0.75], ["C4", 0.25], ["D4", 1], ["C4", 1], ["G4", 1], ["F4", 2],
        ["C4", 0.75], ["C4", 0.25], ["C5", 1], ["A4", 1], ["F4", 1], ["E4", 1], ["D4", 1],
        ["Bb4", 0.75], ["Bb4", 0.25], ["A4", 1], ["F4", 1], ["G4", 1], ["F4", 2],
      ];
      const BASS = ["F2", "C3", "C3", "F2", "F2", "C3", "Bb2", "F2"]; // satu nada per birama

      // Alunan lembut setelah lagu selesai (F - Dm - Bb - C), diulang terus
      const CHORDS = [
        [174.61, 220.0, 261.63, 349.23],
        [146.83, 174.61, 220.0, 293.66],
        [233.08, 293.66, 349.23, 466.16],
        [261.63, 329.63, 392.0, 523.25],
      ];
      const PATTERN = [0, 1, 2, 3, 2, 1, 2, 1];
      const EIGHTH = 0.35;

      let ctx, out, bus, timer;
      let nextStart = 0;
      let firstPass = true;
      let started = false;
      let muted = false;
      let audioEl = null;

      // Dipanggil saat pertama kali layar diketuk (syarat browser untuk audio)
      function unlock() {
        if (CONFIG.music) {
          if (audioEl) return;
          audioEl = new Audio(CONFIG.music);
          audioEl.loop = true;
          audioEl.volume = 0.7;
          audioEl.muted = true;
          audioEl.play()
            .then(() => { audioEl.pause(); audioEl.currentTime = 0; audioEl.muted = false; })
            .catch(() => {});
          return;
        }

        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;

          ctx = new AudioCtx();
          out = ctx.createGain();
          out.connect(ctx.destination);

          bus = ctx.createGain();
          bus.gain.value = 0.6;
          bus.connect(out);

          // Gema tipis supaya bunyinya terasa seperti kotak musik
          const delay = ctx.createDelay();
          const feedback = ctx.createGain();
          const wet = ctx.createGain();
          delay.delayTime.value = 0.32;
          feedback.gain.value = 0.3;
          wet.gain.value = 0.35;
          bus.connect(delay);
          delay.connect(feedback);
          feedback.connect(delay);
          delay.connect(wet);
          wet.connect(out);
        }
        if (ctx.state === "suspended") ctx.resume();
      }

      // Satu nada ala kotak musik: bunyi sinus + sedikit nada atas, lalu meredup
      function tone(freq, time, duration, volume) {
        const gain = ctx.createGain();
        const overtone = ctx.createGain();
        const main = ctx.createOscillator();
        const high = ctx.createOscillator();

        main.type = "sine";
        high.type = "sine";
        main.frequency.value = freq;
        high.frequency.value = freq * 2.01;
        overtone.gain.value = 0.25;

        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(volume, time + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

        main.connect(gain);
        high.connect(overtone);
        overtone.connect(gain);
        gain.connect(bus);

        main.start(time);
        high.start(time);
        main.stop(time + duration + 0.05);
        high.stop(time + duration + 0.05);
      }

      function scheduleMelody(start) {
        let time = start;
        MELODY.forEach(([name, beats]) => {
          tone(NOTE[name], time, 1.6, 0.5);
          time += beats * BEAT;
        });
        BASS.forEach((name, bar) => tone(NOTE[name], start + bar * 3 * BEAT, 2.2, 0.28));
        return time;
      }

      function scheduleAmbient(start) {
        CHORDS.forEach((chord, bar) => {
          PATTERN.forEach((index, step) => {
            tone(chord[index], start + (bar * PATTERN.length + step) * EIGHTH, 1.4, 0.2);
          });
        });
        return start + CHORDS.length * PATTERN.length * EIGHTH;
      }

      // Menjadwalkan nada sedikit demi sedikit agar tidak menumpuk
      function pump() {
        while (nextStart < ctx.currentTime + 1.5) {
          if (nextStart < ctx.currentTime) nextStart = ctx.currentTime + 0.1;
          nextStart = firstPass ? scheduleMelody(nextStart) + 0.6 : scheduleAmbient(nextStart);
          firstPass = false;
        }
      }

      function start() {
        unlock();
        if (started || !(audioEl || ctx)) return;
        started = true;
        button.classList.add("show");

        if (audioEl) {
          audioEl.play().catch(() => {});
          return;
        }
        nextStart = ctx.currentTime + 0.1;
        pump();
        timer = setInterval(pump, 400);
      }

      function toggle() {
        muted = !muted;
        button.classList.toggle("muted", muted);
        button.setAttribute("aria-label", muted ? "Nyalakan musik" : "Matikan musik");

        if (audioEl) {
          if (muted) audioEl.pause();
          else audioEl.play().catch(() => {});
          return;
        }
        out.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, 0.05);
        clearInterval(timer);
        if (!muted) timer = setInterval(pump, 400);
      }

      // Hentikan sementara saat tab ditinggalkan
      document.addEventListener("visibilitychange", () => {
        if (!started || muted) return;
        if (audioEl) {
          if (document.hidden) audioEl.pause();
          else audioEl.play().catch(() => {});
        } else if (ctx) {
          if (document.hidden) ctx.suspend();
          else ctx.resume();
        }
      });

      button.addEventListener("click", toggle);

      return { unlock, start };
    })();

    /* =========================================================
       8. Saat semua lilin padam
       ========================================================= */
    function celebrate() {
      burst(innerWidth * 0.3, innerHeight * 0.4, 70);
      burst(innerWidth * 0.7, innerHeight * 0.4, 70);

      $("#hint").textContent = "TADAAAAAAA! 🎉";
      Music.start();

      const after = $("#after");
      after.classList.add("show");

      setTimeout(() => {
        after.scrollIntoView({ behavior: prefersReducedMotion ? "auto" : "smooth" });
      }, 700);
    }
  </script>
</body>
