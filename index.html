<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hai!</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. Variabel warna
       ========================================================= */
    :root {
      --bg:    #17131d;
      --ivory: #f4ede4;
      --gold:  #d9c3a0;
      --mute:  #9a93a3;
      --ink:   #2a2230;
    }

    /* =========================================================
       2. Dasar
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      background: radial-gradient(90% 60% at 50% 0%, #241c2e 0, var(--bg) 70%);
      color: var(--ivory);
      font-family: Jost, system-ui, sans-serif;
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
    }

    h1,
    h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      line-height: 1.1;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px 90px;
    }

    section {
      padding: 56px 0;
      text-align: center;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
    }

    /* =========================================================
       3. Bagian kue (hero)
       ========================================================= */
    #hero h1 {
      font-size: clamp(2.4rem, 10vw, 4.2rem);
      font-style: italic;
      letter-spacing: 0.01em;
    }

    #hero p {
      margin-top: 14px;
      color: var(--mute);
      font-size: 1.02rem;
    }

    #cake {
      display: block;
      width: min(320px, 84vw);
      margin: 34px auto 0;
    }

    .hint {
      display: inline-block;
      margin-top: 20px;
      color: var(--gold);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    /* Api lilin */
    .flame {
      cursor: pointer;
      transform-origin: center bottom;
      transform-box: fill-box;
      animation: flicker 1.1s ease-in-out infinite alternate;
    }

    .flame:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .flame.off {
      opacity: 0;
      transform: scale(0.2);
      transition: 0.35s;
      animation: none;
    }

    /* Asap muncul tepat setelah api padam */
    .smoke {
      opacity: 0;
    }

    .off + .smoke {
      animation: smoke 1.6s ease-out;
    }

    @keyframes flicker {
      from { transform: scale(1, 1) rotate(-2deg); }
      to   { transform: scale(0.92, 1.1) rotate(2deg); }
    }

    @keyframes smoke {
      0%   { opacity: 0.6; transform: translateY(0); }
      100% { opacity: 0;   transform: translateY(-26px); }
    }

    /* =========================================================
       4. Bagian setelah lilin padam
       ========================================================= */
    #after {
      display: none;
    }

    #after.show {
      display: block;
    }

    #after h2 {
      margin-bottom: 8px;
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      font-style: italic;
    }

    .sub {
      margin-bottom: 30px;
      color: var(--mute);
    }

    /* ---- Kartu ---- */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }

    .card {
      height: 170px;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      perspective: 800px;
    }

    .card:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.7s;
    }

    .card.flip .card-inner {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      border-radius: 4px;
      backface-visibility: hidden;
    }

    .card-front {
      border: 1px solid rgba(217, 195, 160, 0.45);
      color: var(--gold);
      font-family: "Cormorant Garamond", serif;
      font-size: 1.6rem;
      font-style: italic;
    }

    .card-back {
      background: var(--ivory);
      color: var(--ink);
      font-size: 0.98rem;
      font-weight: 400;
      transform: rotateY(180deg);
    }

    /* ---- Tombol permintaan ---- */
    #wish {
      margin-top: 40px;
      padding: 12px 28px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      background: transparent;
      color: var(--gold);
      font: 400 0.98rem Jost, sans-serif;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: 0.25s;
    }

    #wish:hover {
      background: var(--gold);
      color: var(--ink);
    }

    #wish:focus-visible {
      outline: 2px solid var(--ivory);
      outline-offset: 3px;
    }

    #wishtext {
      min-height: 3.2em;
      margin-top: 18px;
      font-family: "Cormorant Garamond", serif;
      font-size: 1.35rem;
      font-style: italic;
    }

    /* ---- Surat ---- */
    #letter {
      margin-top: 44px;
    }

    .env {
      width: min(380px, 100%);
      margin: 0 auto;
      padding: 28px 24px;
      border: 1px solid rgba(217, 195, 160, 0.45);
      border-radius: 4px;
      background: transparent;
      color: var(--ivory);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .env:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .env b {
      display: block;
      color: var(--gold);
      font-family: "Cormorant Garamond", serif;
      font-size: 1.5rem;
      font-style: italic;
      font-weight: 500;
      text-align: center;
    }

    .env .tap {
      display: block;
      margin-top: 6px;
      color: var(--mute);
      font-size: 0.9rem;
      text-align: center;
    }

    .env .msg {
      display: none;
      margin-top: 14px;
      font-weight: 400;
      white-space: pre-line;
    }

    /* Surat terbuka */
    .env.open {
      background: var(--ivory);
      color: var(--ink);
    }

    .env.open b {
      color: #7a6446;
    }

    .env.open .tap {
      display: none;
    }

    .env.open .msg {
      display: block;
    }

    /* =========================================================
       5. Aksesibilitas
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      .flame      { animation: none; }
      .card-inner { transition: none; }
    }
  </style>
</head>

<body>
  <!-- Lapisan konfeti -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <main>

    <!-- Bagian 1: kue dan lilin -->
    <section id="hero">
      <h1 id="title"></h1>

      <svg id="cake" viewBox="0 0 340 300" role="img" aria-label="Kue ulang tahun dengan tiga lilin">
        <!-- Bayangan -->
        <ellipse cx="170" cy="272" rx="150" ry="16" fill="#00000055" />

        <!-- Badan kue -->
        <rect x="40" y="170" width="260" height="100" rx="20" fill="#cfa9a8" />
        <rect x="62" y="120" width="216" height="60" rx="18" fill="#efe3d3" />

        <!-- Krim -->
        <path d="M40 190q22 22 44 0t44 0 44 0 44 0 44 0v-10H40z" fill="#fbf6ef" />
        <path d="M62 140q18 18 36 0t36 0 36 0 36 0 36 0v-10H62z" fill="#fbf6ef" />

        <!-- Hiasan -->
        <circle cx="90" cy="228" r="7" fill="#d9c3a0" />
        <circle cx="170" cy="236" r="7" fill="#f4ede4" />
        <circle cx="250" cy="228" r="7" fill="#d9c3a0" />

        <!-- Lilin dibuat oleh script.js -->
        <g id="candles"></g>
      </svg>

      <span class="hint" id="hint">Ketuk api lilin untuk kejutan</span>
    </section>

    <!-- Bagian 2: muncul setelah semua lilin padam -->
    <section id="after">
      <h2>Semoga semua doamu terkabul</h2>
      <p class="sub">Ketuk kartunya satu per satu</p>

      <div class="cards" id="cards"></div>

      <button id="wish" type="button">Buat permintaan</button>
      <p id="wishtext" aria-live="polite"></p>

      <div id="letter">
        <button class="env" id="env" type="button" aria-expanded="false">
          <b>Ada surat untukmu</b>
          <span class="tap">Ketuk untuk membuka</span>
          <span class="msg" id="msg"></span>
        </button>
      </div>
    </section>

  </main>

  <script>
    /* =========================================================
       1. PENGATURAN: ubah teks di sini
       Gunakan {name} dan {age} untuk memasukkan nama dan umur.
       ========================================================= */
    const CONFIG = {
      name: "Rani",
      age: 19,
      greeting: "Hai Ranii!",

      // Setiap kartu: [judul di depan, isi di belakang]
      cards: [
        ["Kamu",      "Orang yang bikin hari-hari di sekitarmu jadi lebih ringan dan seru."],
        ["Doaku",     "Semoga sehat, bahagia, dan semua rencanamu tahun ini berjalan lancar."],
        ["Harapanku", "Semoga di umur baru ini kamu makin berani, makin tenang, dan makin disayang."],
      ],

      // Satu doa akan dipilih acak saat tombol ditekan
      wishes: [
        "Semoga tahun ini penuh kabar baik.",
        "Semoga mimpimu satu per satu jadi nyata.",
        "Semoga selalu dikelilingi orang yang tulus.",
        "Semoga hatimu selalu tenang dan bahagia.",
        "Semoga ada banyak tawa di setiap harimu.",
      ],

      letter:
        "Selamat ulang tahun, {name}!\n\n" +
        "Terima kasih sudah jadi teman yang baik. Semoga umur {age} ini jadi tahun terbaikmu.\n\n" +
        "Dari temanmu 🤍",
    };

    /* =========================================================
       2. Fungsi bantu
       ========================================================= */
    const $ = (selector) => document.querySelector(selector);

    const fill = (text) =>
      text.replace(/{name}/g, CONFIG.name).replace(/{age}/g, CONFIG.age);

    const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* =========================================================
       3. Isi teks awal
       ========================================================= */
    document.title = `Untuk ${CONFIG.name} 🎂`;
    $("#title").textContent = CONFIG.greeting;
    $("#msg").textContent   = fill(CONFIG.letter);

    /* =========================================================
       4. Lilin
       ========================================================= */
    const SVG_NS = "http://www.w3.org/2000/svg";
    const candleXPositions = [90, 170, 250];
    let litCandles = candleXPositions.length;

    function createCandle(x, index) {
      const isMiddle  = index === 1;
      const bodyY     = isMiddle ? 72 : 80;
      const bodyH     = isMiddle ? 58 : 50;
      const flameY    = isMiddle ? 40 : 48;
      const smokeY    = isMiddle ? 44 : 52;
      const bodyColor = isMiddle ? "#f4ede4" : "#d9c3a0";

      const group = document.createElementNS(SVG_NS, "g");
      group.innerHTML = `
        <rect x="${x - 6}" y="${bodyY}" width="12" height="${bodyH}" rx="4" fill="${bodyColor}" />
        <path class="flame" tabindex="0" role="button" aria-label="Tiup lilin ${index + 1}"
              d="M${x} ${flameY}c10 14 12 22 0 30c-12-8-10-16 0-30z" fill="#f2b866" />
        <circle class="smoke" cx="${x}" cy="${smokeY}" r="7" fill="#ffffff44" />
      `;
      $("#candles").appendChild(group);
    }

    function blowOut(flame) {
      if (flame.classList.contains("off")) return;

      flame.classList.add("off");
      flame.removeAttribute("tabindex");
      litCandles--;

      $("#hint").textContent = litCandles
        ? `Tinggal ${litCandles} lilin lagi`
        : "Make a wish…";

      if (litCandles === 0) setTimeout(celebrate, 500);
    }

    candleXPositions.forEach(createCandle);

    document.querySelectorAll(".flame").forEach((flame) => {
      flame.addEventListener("click", () => blowOut(flame));
      flame.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          blowOut(flame);
        }
      });
    });

    /* =========================================================
       5. Kartu ucapan
       ========================================================= */
    CONFIG.cards.forEach(([title, message]) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.setAttribute("aria-label", `Buka kartu ${title}`);
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-front">${title}</div>
          <div class="card-back">${fill(message)}</div>
        </div>
      `;
      card.addEventListener("click", () => card.classList.toggle("flip"));
      $("#cards").appendChild(card);
    });

    /* =========================================================
       6. Permintaan acak
       ========================================================= */
    let lastWishIndex = -1;

    $("#wish").addEventListener("click", () => {
      let index;
      do {
        index = Math.floor(Math.random() * CONFIG.wishes.length);
      } while (index === lastWishIndex && CONFIG.wishes.length > 1);

      lastWishIndex = index;
      $("#wishtext").textContent = CONFIG.wishes[index];
      burst(innerWidth / 2, innerHeight * 0.6, 40);
    });

    /* =========================================================
       7. Surat
       ========================================================= */
    $("#env").addEventListener("click", (event) => {
      const envelope = event.currentTarget;
      const isOpen = envelope.classList.toggle("open");
      envelope.setAttribute("aria-expanded", isOpen);
    });

    /* =========================================================
       8. Konfeti
       ========================================================= */
    const canvas = $("#fx");
    const ctx = canvas.getContext("2d");
    const CONFETTI_COLORS = ["#cfa9a8", "#efe3d3", "#f4ede4", "#d9c3a0", "#ffffff"];
    let particles = [];
    let animationId = 0;

    function resizeCanvas() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    resizeCanvas();
    addEventListener("resize", resizeCanvas);

    function burst(x, y, count) {
      if (prefersReducedMotion) return;

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 3 + Math.random() * 6;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 4,
          size: 4 + Math.random() * 5,
          color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
          rotation: Math.random() * 6,
          life: 110,
        });
      }

      if (!animationId) animationId = requestAnimationFrame(drawConfetti);
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter((p) => p.life > 0);

      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.18;   // gravitasi
        p.vx *= 0.99;   // hambatan udara
        p.rotation += 0.1;
        p.life--;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = Math.min(1, p.life / 30);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
        ctx.restore();
      });

      animationId = particles.length ? requestAnimationFrame(drawConfetti) : 0;
    }

    /* =========================================================
       9. Saat semua lilin padam
       ========================================================= */
    function celebrate() {
      burst(innerWidth * 0.3, innerHeight * 0.4, 70);
      burst(innerWidth * 0.7, innerHeight * 0.4, 70);

      $("#hint").textContent = "Selamat ulang tahun! 🎉";

      const after = $("#after");
      after.classList.add("show");

      setTimeout(() => {
        after.scrollIntoView({ behavior: prefersReducedMotion ? "auto" : "smooth" });
      }, 700);
    }
  </script>
</body>

</html>
